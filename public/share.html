<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装窑方案只读分享 · Kiln Pre-check</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="share-body">
  <header>
    <h1>🔥 装窑方案（只读分享）</h1>
    <span id="shareMeta" class="muted"></span>
    <span id="pollState" class="muted"></span>
  </header>
  <main>
    <aside id="panel">
      <section class="card">
        <h2>方案</h2>
        <div id="planTitle" class="plan-title">—</div>
      </section>

      <section class="card">
        <h2>窑室与温度</h2>
        <ul class="kv">
          <li><span>窑室宽度</span><b id="kilnWidth"></b></li>
          <li><span>窑室高度</span><b id="kilnHeight"></b></li>
          <li><span>起始温度</span><b id="startTemp"></b></li>
          <li><span>目标温度</span><b id="targetTemp"></b></li>
        </ul>
      </section>

      <section class="card">
        <h2>预检结果</h2>
        <div id="verdict" class="verdict"></div>
        <ul id="contactList" class="contacts"></ul>
      </section>

      <section class="card">
        <h2>坯体</h2>
        <ul id="bodyList" class="bodies"></ul>
      </section>

      <section class="card">
        <h2>预览温度 <span id="previewLabel" class="muted"></span></h2>
        <input id="previewSlider" type="range">
        <p class="muted">黄色虚线：升温膨胀后的坯体外廓</p>
      </section>
    </aside>

    <section id="stage">
      <canvas id="canvas"></canvas>
      <div id="hint">只读视图 · 每 4 秒自动刷新，方案修改会实时反映</div>
      <div id="fatal" hidden></div>
    </section>
  </main>
  <script src="/geometry.js"></script>
  <script src="/share.js"></script>
</body>
</html>
